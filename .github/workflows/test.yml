name: test

on:
  # Tags are excluded because the release workflow calls this one, and a tag
  # push would otherwise run it twice.
  push:
    tags-ignore: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS because the hooks' native git fast path is Unix-only
        # and its filesystem details (realpath, ownership) differ between them.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      # rustup ships on both runner images and installs the version
      # rust-toolchain.toml pins on first use; this makes that explicit.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: cargo test --release --locked
