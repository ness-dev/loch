[package]
name = "loch"
# Kept equal to pyproject's version by release.sh: both implementations answer
# `loch --version`, and they must not disagree while both ship.
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "Save and restore agent coding sessions across machines"
publish = false

[[bin]]
name = "loch"
path = "src/main.rs"

[dependencies]
indexmap = "2"
# Python's `re` has lookarounds, which the `regex` crate deliberately lacks;
# fancy-regex adds them and hands everything else to `regex`.
fancy-regex = "0.14"
# zlib itself, built from source and linked statically: the ref is a hash of
# the gzip bytes, and only zlib's own deflate reproduces zlib's output.
# miniz_oxide (flate2's default) compresses differently.
flate2 = { version = "1", default-features = false, features = ["zlib"] }
libz-sys = { version = "1", default-features = false, features = ["static", "libc"] }
getrandom = "0.2"
sha2 = "0.10"
hmac = "0.12"
# Blocking and rustls-only: no async runtime and no system OpenSSL, so the
# binary stays static. Used by the S3 backend alone.
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
